[workspace]

[package]
name = "stateless-validator-reth-zisk"
version = "0.1.0"
edition = "2024"

[dependencies]
# enable features
alloy-primitives = { version = "1.5.0", default-features = false, features = [
    "map-foldhash",
    "sha3-keccak",
] }
revm = { version = "34.0.0", default-features = false, features = ["bn"] }

# ere
ere-platform-zisk = { git = "https://github.com/eth-act/ere", tag = "v0.2.0" }

# local
stateless-validator-reth = { path = "../../../crates/stateless-validator-reth" }

# Copied from https://github.com/0xPolygonHermez/zisk-eth-client/blob/main/bin/client/rsp/Cargo.toml
[patch.crates-io]
sha2 = { git = "https://github.com/0xPolygonHermez/zisk-patch-hashes.git", tag = "patch-sha2-0.10.9-zisk-0.15.0" }
sha3 = { git = "https://github.com/0xPolygonHermez/zisk-patch-hashes.git", tag = "patch-sha3-0.10.8-zisk-0.15.0" }
k256 = { git = "https://github.com/0xPolygonHermez/zisk-patch-elliptic-curves.git", tag = "patch-k256-0.13.4-zisk-0.15.0" }
substrate-bn = { git = "https://github.com/0xPolygonHermez/zisk-patch-bn.git", tag = "patch-0.6.0-zisk-0.15.0" }
ark-bls12-381 = { git = "https://github.com/0xPolygonHermez/zisk-patch-ark-algebra.git", tag = "patch-0.5.0-zisk-0.15.0" }
ark-ec = { git = "https://github.com/0xPolygonHermez/zisk-patch-ark-algebra.git", tag = "patch-0.5.0-zisk-0.15.0" }
ark-ff = { git = "https://github.com/0xPolygonHermez/zisk-patch-ark-algebra.git", tag = "patch-0.5.0-zisk-0.15.0" }
ark-bn254 = { git = "https://github.com/0xPolygonHermez/zisk-patch-ark-algebra.git", tag = "patch-0.5.0-zisk-0.15.0" }
ark-serialize = { git = "https://github.com/0xPolygonHermez/zisk-patch-ark-algebra.git", tag = "patch-0.5.0-zisk-0.15.0" }
aurora-engine-modexp = { git = "https://github.com/0xPolygonHermez/zisk-patch-modexp.git", tag = "patch-1.2.0-zisk-0.15.0" }
ethereum_hashing = { git = "https://github.com/jsign/ethereum_hashing", rev = "08c88633b700d7447ef840d19ce7b369c44311de" }

[patch."https://github.com/paradigmxyz/reth"]
reth-chainspec = { git = "https://github.com/jsign/reth", rev = "89821048bbe40597ac7e8fe1e48bb2b4dfb6e206" }
reth-ethereum-payload-builder = { git = "https://github.com/jsign/reth", rev = "89821048bbe40597ac7e8fe1e48bb2b4dfb6e206" }
reth-ethereum-primitives = { git = "https://github.com/jsign/reth", rev = "89821048bbe40597ac7e8fe1e48bb2b4dfb6e206" }
reth-evm-ethereum = { git = "https://github.com/jsign/reth", rev = "89821048bbe40597ac7e8fe1e48bb2b4dfb6e206" }
reth-primitives-traits = { git = "https://github.com/jsign/reth", rev = "89821048bbe40597ac7e8fe1e48bb2b4dfb6e206" }
reth-stateless = { git = "https://github.com/jsign/reth", rev = "89821048bbe40597ac7e8fe1e48bb2b4dfb6e206" }
reth-payload-validator = { git = "https://github.com/jsign/reth", rev = "89821048bbe40597ac7e8fe1e48bb2b4dfb6e206" }
reth-revm = { git = "https://github.com/jsign/reth", rev = "89821048bbe40597ac7e8fe1e48bb2b4dfb6e206" }
reth-storage-errors = { git = "https://github.com/jsign/reth", rev = "89821048bbe40597ac7e8fe1e48bb2b4dfb6e206" }
reth-trie-common = { git = "https://github.com/jsign/reth", rev = "89821048bbe40597ac7e8fe1e48bb2b4dfb6e206" }
reth-evm = { git = "https://github.com/jsign/reth", rev = "89821048bbe40597ac7e8fe1e48bb2b4dfb6e206" }
reth-ethereum-consensus = { git = "https://github.com/jsign/reth", rev = "89821048bbe40597ac7e8fe1e48bb2b4dfb6e206" }

[profile.release]
codegen-units = 1
lto = "fat"
